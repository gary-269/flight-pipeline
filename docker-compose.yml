version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    WAREHOUSE_HOST: postgres
    WAREHOUSE_PORT: 5432
    WAREHOUSE_DB: flights
    WAREHOUSE_USER: flights_user
    WAREHOUSE_PASSWORD: flights_pass
    OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID}
    OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./sql:/opt/airflow/sql
    - airflow_logs:/opt/airflow/logs
  depends_on:
    - airflow-db
    - postgres

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: flights
      POSTGRES_USER: flights_user
      POSTGRES_PASSWORD: flights_pass
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flights_user -d flights"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install --no-cache-dir requests psycopg2-binary pandas &&
        airflow db migrate &&
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: bash -c "pip install --no-cache-dir requests psycopg2-binary pandas && airflow webserver"
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: bash -c "pip install --no-cache-dir requests psycopg2-binary pandas && airflow scheduler"
    depends_on:
      - airflow-init

volumes:
  pg_data:
  airflow_db_data:
  airflow_logs: